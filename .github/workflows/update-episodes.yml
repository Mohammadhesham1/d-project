name: Update episodes
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-sync
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install yt-dlp
      - run: python scripts/update_episodes.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}   # اختياري
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain www/episodes.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add www/episodes.json
            git commit -m "chore: new episodes"
            git push
          fi
