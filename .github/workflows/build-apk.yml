name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["www/episodes.json", "www/categories.json", "README.md"]
permissions:
  contents: write
concurrency:
  group: data-sync
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Sync AJ+ playlist into the bundled data
        continue-on-error: true
        run: pip install yt-dlp && python scripts/update_episodes.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Commit refreshed data (so the app can update itself)
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain www/episodes.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add www/episodes.json
            git commit -m "chore: sync episodes"
            git pull --rebase origin ${{ github.ref_name }} && git push
          fi
      - name: Inject repo for live data updates
        run: sed -i "s|__REPO__|${{ github.repository }}|; s|__BRANCH__|${{ github.ref_name }}|" www/app.js
      - run: npm install
      - run: npx cap add android
      - name: Add yt-dlp + native download plugin
        run: python3 scripts/patch_android.py
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#080808' --splashBackgroundColor '#080808'
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aldahih-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
