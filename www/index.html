<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#080808"/>
  <meta name="description" content="كل حلقات الدحيح في مكان واحد"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="الدحيح"/>
  <title>الدحيح</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" href="icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #080808;
      color: #f0f0f0;
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    #app { min-height: 100vh; }

    /* hide scrollbars */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }

    /* card hover cursor */
    .ep-card { cursor: pointer; }

    /* loading screen */
    #loading {
      position: fixed; inset: 0; background: #080808;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 20px; z-index: 9999;
      transition: opacity .4s;
    }
    #loading .logo {
      width: 60px; height: 60px; border-radius: 14px;
      background: linear-gradient(135deg, #c9a84c, #8a6a20);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(201,168,76,.4);
      animation: pulse 1.5s ease-in-out infinite;
    }
    #loading .logo span {
      color: #000; font-weight: 900; font-size: 2rem; font-family: 'Cairo', sans-serif;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 8px 32px rgba(201,168,76,.4); }
      50% { transform: scale(1.05); box-shadow: 0 12px 40px rgba(201,168,76,.6); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(.7); }
      to   { opacity: 1; transform: scale(1); }
    }

    :root { --px: 28px; --pxl: 60px; }
    html { -webkit-text-size-adjust: 100%; }
    body { min-height: 100dvh; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    #app { min-height: 100dvh; }
    #loading { height: 100dvh; }
    button { font-family: inherit; }
    img { max-width: 100%; }

    .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .row-card { flex: 0 0 220px; min-width: 0; }

    /* touch devices: no hover arrows */
    @media (hover: none) { .row-arrow { display: none !important; } }

    @media (max-width: 900px) {
      :root { --pxl: 32px; }
    }
    @media (max-width: 600px) {
      :root { --px: 14px; --pxl: 16px; }
      h1 { font-size: 1.45rem; }
      h2 { font-size: 1.1rem; }
      .hero { min-height: 400px !important; }
      .hero > div:last-child { display: none; }          /* big #id watermark */
      .hero .hero-content, .hero > div[style*="max-width:680px"] { padding-top: 90px !important; padding-bottom: 36px !important; }
      .ep-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .row-card { flex: 0 0 156px; }
      .ep-card h3 { font-size: .82rem !important; }
      section { margin-bottom: 32px !important; }
      .back-ov { display: none !important; }              /* لا يغطي أدوات يوتيوب */
      .nav-btns { width: 100%; flex-shrink: 1 !important; }
      .nav-btns button { flex: 1; justify-content: center; }
      #vol_strip { width: 40px !important; }
      #vslider_r { right: 44px !important; }
      #seek_right { right: 48px !important; }
      #seek_left { left: 6% !important; }
      footer { padding: 28px var(--px) calc(28px + env(safe-area-inset-bottom,0px)) !important; }
    }
    @media (max-width: 360px) { .row-card { flex-basis: 140px; } }
    @media (orientation: landscape) and (max-height: 500px) {
      .hero { min-height: 300px !important; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo"><span>د</span></div>
    <p style="color:#555;font-family:'Cairo',sans-serif;font-size:.9rem;">جاري التحميل…</p>
  </div>
  <div id="app"></div>
  <script src="releases.js"></script>
  <script src="downloads.js"></script>
  <script src="app.js"></script>
  <script>
    // Hide loader once app renders
    const observer = new MutationObserver(() => {
      if (document.querySelector('#app header')) {
        const l = document.getElementById('loading');
        l.style.opacity = '0';
        setTimeout(() => l.remove(), 400);
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('app'), { childList: true, subtree: true });

    // PWA service worker
    const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
    if ('serviceWorker' in navigator && !isNative && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
